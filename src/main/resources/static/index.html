<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashback Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .htmx-added { opacity: 0; transform: translateY(8px); }
    .htmx-settling { opacity: 1; transform: translateY(0); transition: all 0.25s ease-out; }
    .tab-btn.active { background: #4f46e5; color: white; border-color: transparent; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chevron { transform: rotate(180deg); }
    .chevron { transition: transform 0.2s ease; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

<!-- Header -->
<header class="bg-gradient-to-r from-indigo-700 to-indigo-500 sticky top-0 z-20 shadow-lg">
  <div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
    <div>
      <p class="text-xs font-semibold tracking-widest text-indigo-200 uppercase">Maximize Your</p>
      <h1 class="text-xl font-black text-white tracking-tight">Cashback Rewards</h1>
    </div>
    <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center text-xl shadow-inner">
      <span>💳</span>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-5 space-y-4">

  <!-- Best Card Advisor -->
  <section class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <div class="px-5 pt-5 pb-4">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-500 text-base">🏆</div>
        <div>
          <h2 class="font-bold text-slate-800 text-sm leading-tight">Best card for…</h2>
          <p class="text-xs text-slate-400">Pick a category</p>
        </div>
      </div>
      <div id="category-pills"
           class="flex gap-2 flex-wrap"
           hx-get="/categories/pills" hx-trigger="load"
           hx-on::after-settle="initPills()">
      </div>
    </div>
    <div id="best-card-result" class="px-5 pb-5"></div>
  </section>

  <!-- Manage Categories -->
  <details class="bg-white rounded-2xl shadow-sm">
    <summary class="px-5 py-4 font-semibold text-slate-700 flex justify-between items-center select-none">
      <div class="flex items-center gap-2.5">
        <span class="w-7 h-7 bg-slate-100 rounded-lg flex items-center justify-center text-sm">⚙️</span>
        <span class="text-sm">Manage Categories</span>
      </div>
      <svg class="chevron w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </summary>
    <div class="px-5 pb-5 pt-3 space-y-3 border-t border-slate-50">
      <form hx-post="/categories"
            hx-target="#categories-manage-list"
            hx-swap="innerHTML"
            hx-on::after-request="this.reset()"
            class="flex gap-2">
        <input name="name" required placeholder="New category name…"
               class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold active:scale-95 transition-all">
          Add
        </button>
      </form>
      <div id="categories-manage-list"
           class="divide-y divide-slate-50"
           hx-get="/categories/manage" hx-trigger="load">
        <p class="text-sm text-slate-400 py-2 text-center">Loading…</p>
      </div>
    </div>
  </details>

  <!-- Tabs -->
  <div class="flex gap-1.5 bg-slate-200/70 p-1 rounded-2xl">
    <button id="tab-cards"
            class="tab-btn active flex-1 py-2.5 rounded-xl text-sm font-bold border border-transparent transition-all"
            onclick="showTab('cards')">My Cards</button>
    <button id="tab-transactions"
            class="tab-btn flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-500 border border-transparent transition-all"
            onclick="showTab('transactions')">Transactions</button>
  </div>

  <!-- Cards Tab -->
  <div id="panel-cards">
    <div id="cards-list"
         hx-get="/cards" hx-trigger="load"
         class="space-y-3 mb-4">
      <div class="bg-white rounded-2xl h-24 animate-pulse shadow-sm"></div>
    </div>

    <!-- Add Card form -->
    <details class="bg-white rounded-2xl shadow-sm"
             ontoggle="if(this.open) htmx.ajax('GET', '/categories/rate-inputs', {target: '#card-rate-inputs', swap: 'innerHTML'})">
      <summary class="px-5 py-4 font-semibold text-slate-700 flex justify-between items-center select-none">
        <div class="flex items-center gap-2.5">
          <span class="w-7 h-7 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 text-sm font-bold">+</span>
          <span class="text-sm">Add a card</span>
        </div>
        <svg class="chevron w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </summary>
      <form hx-post="/cards"
            hx-target="#cards-list"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()"
            class="px-5 pb-5 pt-3 space-y-4 border-t border-slate-50">
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Card Name</label>
            <input name="name" required placeholder="e.g. Chase Freedom"
                   class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Network</label>
            <select name="network"
                    class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white">
              <option>Visa</option>
              <option>Mastercard</option>
              <option>Amex</option>
              <option>Discover</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Annual Fee ($)</label>
            <input name="annual_fee" type="number" min="0" step="1" placeholder="0"
                   class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Reward Limit ($)</label>
            <input name="reward_limit" type="number" min="0" step="1" placeholder="0 = unlimited"
                   class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
          </div>
        </div>
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Cashback Rates (%)</p>
            <span class="text-xs text-slate-400">Leave 0 to skip</span>
          </div>
          <div id="card-rate-inputs" class="grid grid-cols-2 gap-3">
            <p class="col-span-2 text-sm text-slate-400 text-center py-3 bg-slate-50 rounded-xl">Open to load categories…</p>
          </div>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm active:scale-95 transition-all shadow-md shadow-indigo-200/50">
          Add Card
        </button>
      </form>
    </details>
  </div>

  <!-- Transactions Tab -->
  <div id="panel-transactions" class="hidden">
    <form hx-post="/transactions"
          hx-target="#tx-body"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset()"
          class="bg-white rounded-2xl shadow-sm p-5 mb-4 space-y-3">
      <h3 class="font-bold text-slate-700 text-sm">Log a Transaction</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Card</label>
          <select name="card_id" id="tx-card-select"
                  hx-get="/card-options" hx-trigger="load"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white">
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Category</label>
          <select name="category" id="tx-category-select"
                  hx-get="/categories/options" hx-trigger="load"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white">
          </select>
        </div>
      </div>
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Amount ($)</label>
        <input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
      </div>
      <button type="submit"
              class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold text-sm active:scale-95 transition-all shadow-md shadow-green-200/50">
        Log Transaction
      </button>
    </form>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-100">
            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Date</th>
            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Card</th>
            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Category</th>
            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Amount</th>
            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Cashback</th>
            <th class="py-3 px-4"></th>
          </tr>
        </thead>
        <tbody id="tx-body" hx-get="/transactions" hx-trigger="load">
          <tr><td colspan="6" class="py-10 text-center text-slate-400 text-sm">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
  function showTab(tab) {
    document.getElementById('panel-cards').classList.toggle('hidden', tab !== 'cards');
    document.getElementById('panel-transactions').classList.toggle('hidden', tab !== 'transactions');
    ['cards', 'transactions'].forEach(t => {
      var btn = document.getElementById('tab-' + t);
      btn.classList.toggle('active', t === tab);
      btn.classList.toggle('text-slate-500', t !== tab);
    });
    if (tab === 'transactions') {
      htmx.ajax('GET', '/card-options', {target: '#tx-card-select', swap: 'innerHTML'});
      htmx.ajax('GET', '/categories/options', {target: '#tx-category-select', swap: 'innerHTML'});
    }
    if (tab === 'cards') {
      htmx.ajax('GET', '/cards', {target: '#cards-list', swap: 'innerHTML'});
    }
  }

  function initPills() {
    var first = document.querySelector('#category-pills .category-pill');
    if (first) selectCategory(first, first.dataset.category);
  }

  function selectCategory(btn, category) {
    document.querySelectorAll('.category-pill').forEach(b => {
      b.className = 'category-pill px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100 text-slate-600 transition-colors cursor-pointer';
    });
    btn.className = 'category-pill px-3 py-1.5 rounded-full text-sm font-semibold bg-indigo-600 text-white transition-colors cursor-pointer';
    htmx.ajax('GET', '/best/' + encodeURIComponent(category), {target: '#best-card-result', swap: 'innerHTML'});
  }
</script>

</body>
</html>
